services:
  postgres:
    image: postgres:16
    container_name: bugmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bugmind
      POSTGRES_USER: bugmind
      POSTGRES_PASSWORD: bugmind_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
